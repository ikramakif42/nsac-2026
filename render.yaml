services:
  - type: web
    name: orbit-lens-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RELEASE
        value: qr3
      - key: CORS_ORIGINS
        value: "*"
